name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:

permissions:
  contents: write   # required to push to gh-pages

jobs:
  build-and-deploy:
    name: Build mkdocs site and deploy to gh-pages
    runs-on: ubuntu-latest
    # On pull_request, only deploy when the PR is actually merged to main.
    if: >
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed for `mkdocs gh-deploy` to push to gh-pages

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs,plot]"

      - name: Configure git
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Build (strict)
        run: mkdocs build --strict

      - name: Deploy to gh-pages branch
        run: mkdocs gh-deploy --force --no-history --remote-branch gh-pages
