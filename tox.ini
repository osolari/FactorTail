[tox]
min_version = 4.0
env_list = py{310,311,312}, lint, type, docs

[testenv]
description = Run the test suite
deps =
    pytest
    pytest-cov
    pytest-xdist
    hypothesis
extras =
    plot
commands =
    pytest {posargs:tests} --cov=factortail --cov-report=term-missing

[testenv:lint]
description = Lint and format checks
skip_install = true
deps =
    ruff
    black
commands =
    ruff check src tests scripts
    black --check src tests scripts

[testenv:type]
description = Type-check with mypy
deps =
    mypy
    types-PyYAML
extras = plot
commands = mypy src/factortail

[testenv:docs]
description = Build mkdocs site (strict)
deps =
    mkdocs
    mkdocs-material
    mkdocstrings[python]
extras = plot
commands = mkdocs build --strict
